services:
  - type: web
    name: german-spam-call-detection
    runtime: python
    buildCommand: pip install -r requirements.txt && python generate_data.py && python process_data.py
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0